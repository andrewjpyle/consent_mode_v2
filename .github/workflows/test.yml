name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests and assert a minimum count
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee test.log
          count=$(grep -E '^(ℹ|#) pass ' test.log | awk '{print $3}')
          echo "passing tests: $count"
          test "${count:-0}" -ge 34
